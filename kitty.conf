# map ctrl+t>5 goto_tab 5
# map ctrl+t>6 goto_tab 6
# map ctrl+t>7 goto_tab 7
# map ctrl+t>8 goto_tab 8
# map ctrl+t>9 goto_tab 9

# ===== Window & Decorations =====
hide_window_decorations no
window_padding_width 5

# 关闭 OS 窗口或标签前弹出确认对话框，避免误关
# -1: 即使只有一个窗口/标签也会询问；正数 N 表示有 N 个以上 kitten 在运行时才询问
confirm_os_window_close 0

# 窗口边框设置（已关闭）
# window_border_width 1
# active_border_color #50fa7b
# inactive_border_color #6272a4
# draw_minimal_borders yes

# ===== Custom Title Bar (Tab Bar) =====
tab_bar_edge top
tab_bar_style custom
tab_separator " │ "
tab_title_template " {title} "
tab_bar_background #000000
# Active tab: 反白显示 (black foreground on white background)
active_tab_foreground   #000000
active_tab_background   #ffffff
active_tab_font_style   bold

# Inactive tab: Dark gray foreground, medium gray background
inactive_tab_foreground #808080
inactive_tab_background #3a3a3a
inactive_tab_font_style normal 

repaint_delay 10
input_delay 0


# ===== Advanced Features =====
shell_integration enabled
allow_remote_control yes
listen_on unix:/tmp/mykitty

# ===== Auto Session Save & Restore =====
# session_watcher.py calls official save_as_session (all tabs) on tab changes and quit.
watcher session_watcher.py
startup_session last_session.kitty

# ===== Hints / Search / Scroll Marks =====
# Hints Kitten：屏幕上标注并选择 URL / 路径 / 行号，按字母键执行
# ctrl+p u → 屏幕选 URL 并用浏览器打开
map ctrl+p>u kitten hints --type url
# ctrl+p f → 屏幕选文件路径并用 nvim 打开
map ctrl+p>f kitten hints --type path --program nvim
# ctrl+p y → 屏幕选一行文本并复制到剪贴板
map ctrl+p>y kitten hints --type line --program @

# Search Kitten：在 scrollback 里正则搜索
# ctrl+p s → 智能搜索：tmux 内用 tmux 原生搜索，kitty 原生用 search kitten
# search-launcher.sh 自动检测环境并切换，退出后还原原布局
map ctrl+p>s launch --type=background bash $HOME/.config/kitty/search-launcher.sh
# Keybindings Cheat Sheet (tmux ?)
# ctrl+p ? → 弹出全英文快捷键速查文档，按 q 退出
map ctrl+p>? launch --type=overlay less -R -F -X -P " [Kitty & Tmux Keybindings Cheat Sheet] (Press q to exit) " $HOME/.config/kitty/docs/cheatsheet.txt
map ctrl+p>shift+/ launch --type=overlay less -R -F -X -P " [Kitty & Tmux Keybindings Cheat Sheet] (Press q to exit) " $HOME/.config/kitty/docs/cheatsheet.txt
# Scroll Marks：在 scrollback 标记之间跳转
# scroll_mark.py 是 no_ui 的 remote-control kitten，用 launch --type=background 调用
# ctrl+p j → 下一个标记
map ctrl+p>j launch --type=background kitten scroll_mark.py next
# ctrl+p k → 上一个标记
map ctrl+p>k launch --type=background kitten scroll_mark.py prev

# ===== Window Management Shortcuts =====
map f11 toggle_fullscreen
map ctrl+shift+m toggle_maximized
map ctrl+shift+i minimize_window

# Window resizing with keyboard (Ctrl+Shift+Arrows)
map ctrl+shift+left resize_window narrower
map ctrl+shift+right resize_window wider
map ctrl+shift+up resize_window taller
map ctrl+shift+down resize_window shorter

# BEGIN_KITTY_THEME
# 3024 Night
include current-theme.conf
# END_KITTY_THEME
