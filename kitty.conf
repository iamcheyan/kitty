# ===== Font =====
# Use a login shell so /etc/zprofile (and ~/.zprofile) are sourced, which
# ensures Homebrew PATH (/opt/homebrew/bin) is set before zshrc runs.
# "zsh -l" resolves through PATH: works on macOS, Linux, and NixOS.
shell zsh -l
font_family JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0
adjust_line_height 100%
# 字体回退链暂不启用：symbol_map 会影响当前 Kitty/zsh 字符与光标显示。
# 详见 docs/font-fallback.md；先保持主字体配置稳定。

# ===== Wayland =====
linux_display_server wayland

# ===== Colors (Zellij Green/Dracula) =====
background #000000
foreground #f8f8f2
cursor     #50fa7b
cursor_shape beam
selection_background #44475a
selection_foreground #f8f8f2

color0  #21222c
color1  #ff5555
color2  #50fa7b
color3  #f1fa8c
color4  #bd93f9
color5  #ff79c6
color6  #8be9fd
color7  #f8f8f2
color8  #6272a4
color9  #ff6e6e
color10 #69ff94
color11 #ffffa5
color12 #d6acff
color13 #ff92df
color14 #a4ffff
color15 #ffffff

# ===== Clipboard & Keybindings (GUI-style) =====
copy_on_select yes
map ctrl+c copy_or_interrupt
# Smart paste: if the clipboard holds an image, save it to /tmp and paste its
# PATH (terminals can't render image data); otherwise paste text normally.
# Text is injected via `kitty @ send-text` (no Ctrl+V re-injection, so this
# bind cannot retrigger itself).

# macOS: Option 键当作 Alt/Meta 键使用（发送 ESC 序列），支持 omp (Alt+p 切换模型)、zsh、vim 等 Alt 快捷键
macos_option_as_alt yes

# macOS: self-contained script in ~/.config/kitty/ (no sumika-shell).
# Requires: brew install pngpaste jq
#
# System paste (cmd+v) stays native — voice input, copy-paste, everything
# works untouched. ctrl+v stays free for programs (vim visual-block, etc).
# Only ctrl+shift+v goes through the smart-paste script.
map ctrl+shift+v launch --type=background bash ${HOME}/.config/kitty/kitty-smart-paste
map shift+insert launch --type=background bash ${HOME}/.config/kitty/kitty-smart-paste





# Send SIGINT (Ctrl+C signal) via Shift when needed
map ctrl+shift+c send_text all \x03

# ===== Tmux-style keybindings (Ctrl+p prefix) =====
# 操作方式与 tmux 一致:按 ctrl+p 松开,再按对应键
# 注意:kitty 的 map 行不能带行尾注释,注释一律写在本行之前

# 分屏(自动切换到 splits 布局)
# 左右分屏 (tmux %)
map ctrl+p>% combine : goto_layout splits : launch --location=vsplit
# 上下分屏 (tmux ")
map ctrl+p>" combine : goto_layout splits : launch --location=hsplit

# 焦点移动
# 下一个窗格 (tmux o)
map ctrl+p>o next_window
# 左移焦点 (tmux ←)
map ctrl+p>left neighboring_window left
# 右移焦点 (tmux →)
map ctrl+p>right neighboring_window right
# 上移焦点 (tmux ↑)
map ctrl+p>up neighboring_window top
# 下移焦点 (tmux ↓)
map ctrl+p>down neighboring_window bottom

# 窗格操作
# 关闭窗格 (tmux x)
map ctrl+p>x close_window_with_confirmation
# 放大/还原窗格 (tmux z)
map ctrl+p>z toggle_layout stack
# 与上一窗格交换 (tmux {)
map ctrl+p>{ move_window -1
# 与下一窗格交换 (tmux })
map ctrl+p>} move_window 1
# 拆出为独立窗口 (tmux !)
map ctrl+p>! detach_window

# 窗口管理 (tmux window = kitty tab)
# 新建窗口 (tmux c)
map ctrl+p>c new_tab
# 下一个窗口 (tmux n)
map ctrl+p>n next_tab
# 上一个窗口 (tmux p)
map ctrl+p>p previous_tab
map ctrl+p>0 goto_tab 0
map ctrl+p>1 goto_tab 1
map ctrl+p>2 goto_tab 2
map ctrl+p>3 goto_tab 3
map ctrl+p>4 goto_tab 4
map ctrl+p>5 goto_tab 5
map ctrl+p>6 goto_tab 6
map ctrl+p>7 goto_tab 7
map ctrl+p>8 goto_tab 8
map ctrl+p>9 goto_tab 9
# 关闭窗口 (tmux &)
map ctrl+p>& close_tab
# 重命名窗口 (tmux ,)
map ctrl+p>, set_tab_title
# 重载 Kitty 配置并弹出系统通知 (tmux r)

map ctrl+p>r combine : load_config_file : launch --type=background bash ${HOME}/.config/kitty/notify-reload.sh


# Tab mode (Ctrl+t ...)
# map ctrl+t>h previous_tab
# map ctrl+t>l next_tab
# map ctrl+t>n new_tab
# map ctrl+t>x close_tab
